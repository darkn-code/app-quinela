services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiniela-mundial-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      APP_ENV: ${APP_ENV:-local}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    command: >
      sh -c "if [ -f package.json ]; then
      npm install && npm run dev -- --host 0.0.0.0;
      else
      echo 'Frontend React + Vite no inicializado todavia. Crea la app dentro de /frontend para iniciar Vite.' && sleep infinity;
      fi"

volumes:
  frontend_node_modules:
